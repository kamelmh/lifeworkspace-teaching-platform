[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taallim"
version = "1.0.0"
description = "AI-powered English teaching platform for Algerian schools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mahi Kamel Abdelghani", email = "kamelmahi71@gmail.com"}
]
keywords = ["education", "english", "teaching", "algeria", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.18.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
taallim = "taallim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
